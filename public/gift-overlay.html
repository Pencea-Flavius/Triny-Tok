<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Game themes ── */
    :root                          { --bg-a:rgba(16,185,129,0.05); --bg-b:rgba(16,185,129,0.15); --border:rgba(16,185,129,.35); --glow:rgba(16,185,129,.2); --accent:#10b981; } /* GOI Green */
    body[data-game="minecraft"]    { --bg-a:rgba(132,204,22,0.05); --bg-b:rgba(132,204,22,0.15); --border:rgba(132,204,22,.35); --glow:rgba(132,204,22,.2);  --accent:#84cc16; } /* Minecraft Lime */
    body[data-game="isaac"]        { --bg-a:rgba(239,68,68,0.05); --bg-b:rgba(239,68,68,0.15); --border:rgba(239,68,68,.38); --glow:rgba(239,68,68,.22); --accent:#ef4444; } /* Isaac Red */
    body[data-game="repo"]         { --bg-a:rgba(249,115,22,0.05); --bg-b:rgba(249,115,22,0.15); --border:rgba(249,115,22,.38); --glow:rgba(249,115,22,.22); --accent:#f97316; } /* REPO Orange */

    body {
      font-family: 'Outfit', sans-serif;
      background: transparent;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* ── Edit bar (top) ── */
    #editBar {
      width: 100%; max-width: 940px;
      display: flex; align-items: center; justify-content: flex-end;
      gap: 8px; margin-bottom: 6px;
    }
    #editBar.hidden { display: none; }

    .edit-btn {
      background: var(--accent); border: none;
      color: #000; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 12px var(--accent-glow); transition: all .2s;
    }
    .edit-btn:hover { transform: translateY(-1px); filter: brightness(1.15); }
    .edit-btn.active {
      background: #fff; color: #000; box-shadow: 0 4px 12px rgba(255,255,255,0.3);
    }

    /* ── Overlay wrapper ── */
    .overlay-wrap {
      width: 100%; max-width: 940px;
      padding: 16px 18px 14px;
      background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 50%, var(--bg-a) 100%);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px var(--glow), 0 4px 30px rgba(0,0,0,.6),
                  inset 0 1px 0 rgba(255,255,255,.07);
      position: relative;
    }
    .grid-header { text-align: center; margin-bottom: 12px; }
    .grid-header h1 {
      font-size: 12px; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: rgba(255,255,255,.38);
    }

    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .loading-msg, .empty-msg {
      grid-column: 1/-1; text-align: center;
      color: rgba(255,255,255,.4); padding: 30px; font-size: 14px;
    }

    /* ── Card ── */
    .gift-card {
      position: relative;
      border-radius: 14px;
      border: 1px solid rgba(127,127,127,.25);
      background: rgba(255,255,255,0.04);
      overflow: hidden;
      min-height: 130px;
      display: flex; flex-direction: column;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .22s ease;
      cursor: default;
    }
    .gift-card:hover {
      transform: translateY(-4px) scale(1.025);
      box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 16px var(--glow);
      border-color: var(--border);
      background: rgba(255,255,255,0.07);
    }

    /* Effect image — only rendered when JS sets backgroundImage */
    .card-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      transition: filter .3s;
    }
    .card-bg.has-image {
      filter: blur(2px) brightness(0.32);
    }
    .gift-card:hover .card-bg.has-image { filter: blur(1px) brightness(0.45); }

    /* Dark gradient overlay — only when image present */
    .card-bg.has-image::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.7) 100%);
    }

    /* Card content sits above bg */
    .card-content {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; padding: 12px 8px 10px;
      flex: 1;
    }

    /* Big effect name */
    .gift-effect {
      font-size: 14px; font-weight: 800; text-align: center; color: #fff;
      line-height: 1.25; margin-bottom: 8px; padding: 2px 4px;
      text-shadow: 0 1px 8px rgba(0,0,0,.7);
      outline: none; white-space: pre-wrap; word-break: break-word;
      flex: 1; display: flex; align-items: center; justify-content: center;
    }
    body.edit-mode .gift-effect {
      outline: 1.5px dashed rgba(245,158,11,.65);
      border-radius: 6px; cursor: text; min-height: 36px; min-width: 80%;
    }
    body.edit-mode .gift-effect:focus {
      outline: 2px solid #f59e0b; background: rgba(245,158,11,.08);
    }

    /* Diamond icon */
    .diamond-ico { width: 10px; height: 10px; fill: currentColor; flex-shrink: 0; }

    /* Bottom strip: diamonds + gift image corner */
    .card-bottom {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      gap: 4px; padding: 0 8px 8px;
    }
    .gift-diamonds {
      font-size: 11px; font-weight: 700;
      color: rgba(255,215,0,.9);
      display: flex; align-items: center; gap: 3px;
    }
    .gift-name {
      font-size: 8.5px; font-weight: 600;
      color: rgba(255,255,255,.3); text-transform: uppercase;
      letter-spacing: .3px; margin-left: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80px;
    }

    /* Gift image — small, in bottom-right corner, overlapping card edge */
    .gift-img-corner {
      position: absolute; bottom: 8px; right: 8px; z-index: 2;
      width: 54px; height: 54px;
    }
    .gift-img-corner img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.8));
      transition: transform .22s cubic-bezier(.34,1.56,.64,1);
    }
    .gift-card:hover .gift-img-corner img { transform: scale(1.15) rotate(-8deg); }

    /* Center effect image when present */
    .effect-img-center {
      position: absolute; inset: 10px; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      padding-bottom: 8px; /* Room for corner gift */
    }
    .effect-img-center img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 20px var(--accent-glow));
      transition: transform .22s cubic-bezier(.34,1.56,.64,1);
    }
    body[data-game="isaac"] .effect-img-center img {
      image-rendering: pixelated;
    }
    
    /* Isaac Sprites */
    .isaac-sprite {
      width: 44px; height: 44px;
      background-image: url('/images/Isaac/items.png');
      background-size: 880px auto; background-repeat: no-repeat;
      transform: scale(2); /* make it large enough */
      filter: drop-shadow(0 0 10px var(--accent-glow));
      transition: transform .22s cubic-bezier(.34,1.56,.64,1);
    }
    body[data-game="isaac"] .isaac-sprite {
      image-rendering: pixelated;
    }

    .gift-card:hover .effect-img-center img { transform: scale(1.1); }
    .gift-card:hover .effect-img-center .isaac-sprite { transform: scale(2.2); }

    /* Scanline overlay */
    .overlay-wrap::after {
      content:''; position:absolute; inset:0; border-radius:20px; pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);
    }

    /* Multiplier Badge */
    .multiplier-badge {
      position: absolute; top: 10px; right: 10px; z-index: 5;
      background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2);
      color: var(--accent); font-size: 11px; font-weight: 800;
      padding: 3px 6px; border-radius: 6px; letter-spacing: 0.5px;
      backdrop-filter: blur(4px); box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);
    }
  </style>
</head>
<body>

<div id="editBar">
  <input type="color" id="bgPicker" title="Container Background Color" style="cursor:pointer; width:34px; height:34px; border:none; border-radius:6px; background:none; padding:0;">
  <button class="edit-btn" id="copyObsBtn" style="background:#3b82f6; color:#fff; box-shadow:none;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    <span>Copy OBS Link</span>
  </button>
  <button class="edit-btn" id="resetBtn" style="background:#ef4444; color:#fff; box-shadow:none;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path>
    </svg>
    <span>Reset</span>
  </button>
  <button class="edit-btn" id="editBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
    </svg>
    <span>Edit</span>
  </button>
</div>

<div class="overlay-wrap">
  <div class="gifts-grid" id="giftsGrid">
    <div class="loading-msg">Loading...</div>
  </div>
</div>

<script>
  const DIAMOND = `<svg class="diamond-ico" viewBox="0 0 20 20">
    <polygon points="10,1 19,8 10,19 1,8"/>
    <polygon points="1,8 10,8 10,19" style="fill:rgba(0,0,0,0.18)"/>
  </svg>`;

  const params      = new URLSearchParams(location.search);
  const currentGame = (params.get('game') || 'goi').toLowerCase();
  let editMode      = false;

  const body      = document.body;
  const editBar   = document.getElementById('editBar');
  const editBtn   = document.getElementById('editBtn');
  const grid      = document.getElementById('giftsGrid');

  // Automatically hide edit bar if loaded in OBS Studio or if obs=1 is passed
  const isOBS = params.get('obs') === '1' || window.obsstudio !== undefined;
  if (isOBS) {
      editBar.classList.add('hidden');
  }

  const overlayWrap = document.querySelector('.overlay-wrap');
  const bgPicker = document.getElementById('bgPicker');

  function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : null;
  }

  function applyCustomTheme(hex) {
      const rgb = hexToRgb(hex);
      if (!rgb) return;
      const {r, g, b} = rgb;
      // Use higher opacity so the color is actually visible on stream over the game
      body.style.setProperty('--bg-a', `rgba(${r},${g},${b},0.45)`);
      body.style.setProperty('--bg-b', `rgba(${r},${g},${b},0.65)`);
      body.style.setProperty('--border', `rgba(${r},${g},${b},0.4)`);
      body.style.setProperty('--glow', `rgba(${r},${g},${b},0.3)`);
      body.style.setProperty('--accent', hex);
      overlayWrap.style.background = '';
  }

  bgPicker.addEventListener('input', (e) => {
      applyCustomTheme(e.target.value);
  });
  bgPicker.addEventListener('change', async (e) => {
      try {
          await fetch('/api/overlay/color', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ game: currentGame, color: e.target.value })
          });
      } catch (e) {}
  });

  document.getElementById('copyObsBtn').addEventListener('click', async () => {
      const url = new URL(location.href);
      url.searchParams.set('obs', '1');
      try {
          await navigator.clipboard.writeText(url.toString());
          const span = document.getElementById('copyObsBtn').querySelector('span');
          const originalText = span.textContent;
          span.textContent = 'Copied!';
          setTimeout(() => span.textContent = originalText, 1500);
      } catch (e) {
          alert('Failed to copy link.');
      }
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
      if (confirm('Reset custom names and container background color?')) {
          try {
              await fetch('/api/overlay/reset', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ game: currentGame })
              });
          } catch (e) {}
          location.reload();
      }
  });

  body.dataset.game  = currentGame;

  // Edit toggle
  editBtn.addEventListener('click', () => {
    editMode = !editMode;
    body.classList.toggle('edit-mode', editMode);
    editBtn.classList.toggle('active', editMode);
    editBtn.lastChild.textContent = editMode ? ' Done' : ' Edit';
    document.querySelectorAll('.gift-effect').forEach(el => {
      el.contentEditable = editMode ? 'true' : 'false';
    });
    
    // Fail-safe: Save the color when they click "Done" just to be absolutely sure
    if (!editMode) {
        try {
            fetch('/api/overlay/color', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ game: currentGame, color: bgPicker.value })
            });
        } catch (e) {}
    }
  });

  // Build card
  function buildCard(gift) {
    const card = document.createElement('div');
    card.className = 'gift-card' + (gift.effectImage ? ' has-effect-img' : ' no-effect-img');

    // Multiplier/Duration badge
    let badgeText = '';
    if (gift.count) badgeText = `x${gift.count}`;
    else if (gift.duration) badgeText = `${gift.duration}s`;
    
    if (badgeText) {
        const badge = document.createElement('div');
        badge.className = 'multiplier-badge';
        badge.textContent = badgeText;
        card.appendChild(badge);
    }

    // Content
    const content = document.createElement('div');
    content.className = 'card-content';

    if (gift.sprite) {
        const efxImgWrap = document.createElement('div');
        efxImgWrap.className = 'effect-img-center';
        const spriteDiv = document.createElement('div');
        spriteDiv.className = 'isaac-sprite';
        spriteDiv.style.backgroundPosition = `${gift.sprite.x}px ${gift.sprite.y}px`;
        efxImgWrap.appendChild(spriteDiv);
        content.appendChild(efxImgWrap);
    } else if (gift.effectImage) {
        const efxImgWrap = document.createElement('div');
        efxImgWrap.className = 'effect-img-center';
        const eImg = document.createElement('img');
        eImg.src = gift.effectImage;
        efxImgWrap.appendChild(eImg);
        content.appendChild(efxImgWrap);
    } else {
        const eff = document.createElement('div');
        eff.className = 'gift-effect';
        eff.textContent = gift.effectName;
        eff.contentEditable = editMode ? 'true' : 'false';
        eff.addEventListener('blur', () => {
            const customName = eff.textContent.trim();
            fetch('/api/overlay/rename', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ game: currentGame, giftName: gift.name, customName })
            });
        });
        eff.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); eff.blur(); } });
        content.appendChild(eff);
    }

    card.appendChild(content);

    // Corner gift image (always present)
    if (gift.imagePath) {
      const corner = document.createElement('div');
      corner.className = 'gift-img-corner';
      const ci = document.createElement('img');
      ci.alt = gift.name; ci.src = gift.imagePath;
      ci.onerror = () => { ci.src = gift.imagePath.endsWith('.png') ? gift.imagePath.replace('.png','.webp') : gift.imagePath.replace('.webp','.png'); };
      corner.appendChild(ci);
      card.appendChild(corner);
    }

    return card;
  }

  // Load gifts
  async function load() {
    grid.innerHTML = '<div class="loading-msg">Loading...</div>';
    try {
      const res  = await fetch('/api/overlay?game=' + currentGame);
      const data = await res.json();
      
      if (data.customColor) {
          bgPicker.value = data.customColor;
          applyCustomTheme(data.customColor);
      }

      grid.innerHTML = '';
        if (!data.gifts?.length) {
          grid.innerHTML = '<div class="empty-msg">No gifts configured.</div>';
          return;
        }
      data.gifts.forEach(g => {
        // Normalise — support both old API (effectCode) and new (effectName)
        g.effectName = g.effectName || g.effectCode || g.name;
        grid.appendChild(buildCard(g));
      });
    } catch (e) {
      grid.innerHTML = `<div class="empty-msg">Eroare: ${e.message}</div>`;
    }
  }

  load();
</script>
</body>
</html>
